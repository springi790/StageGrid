name: Android CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare stable debug signing key
        shell: bash
        run: |
          base64 --decode ci/stagegrid-debug.keystore.b64 > app/stagegrid-debug.keystore
          keytool -list \
            -keystore app/stagegrid-debug.keystore \
            -storepass stagegrid-debug \
            -alias stagegrid-debug >/dev/null

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk '$1 == "platforms;android-37.0" || $1 == "platforms;android-37" { print $1; exit }')"
          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "Android 17/API 37 platform package was not found by sdkmanager."
            sdkmanager --list --channel=3 | grep -E 'platforms;android-3[67]|build-tools;37' || true
            exit 1
          fi
          echo "Installing $PLATFORM_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Unit tests and debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stagegrid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
