name: Android CI

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        id: java_setup
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare stable debug signing key
        id: debug_signing
        shell: bash
        run: |
          base64 --decode ci/stagegrid-debug.keystore.b64 > app/stagegrid-debug.keystore
          keytool -list \
            -keystore app/stagegrid-debug.keystore \
            -storepass stagegrid-debug \
            -alias stagegrid-debug >/dev/null

      - name: Setup Android SDK
        id: android_sdk_setup
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        id: android_sdk_install
        shell: bash
        run: |
          set -o pipefail
          {
            yes | sdkmanager --licenses >/dev/null || true
            PLATFORM_PACKAGE="$(sdkmanager --list --channel=3 | awk '$1 == "platforms;android-37.0" || $1 == "platforms;android-37" { print $1; exit }')"
            if [ -z "$PLATFORM_PACKAGE" ]; then
              echo "Android 17/API 37 platform package was not found by sdkmanager."
              sdkmanager --list --channel=3 | grep -E 'platforms;android-3[67]|build-tools;37' || true
              exit 1
            fi
            echo "Installing $PLATFORM_PACKAGE"
            sdkmanager --channel=3 "$PLATFORM_PACKAGE" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          } 2>&1 | tee ci-sdk-install.log

      - name: Prepare Gradle wrapper
        shell: bash
        run: chmod +x gradlew

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee ci-unit-tests.log

      - name: Build debug APK
        id: assemble_debug
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ci-assemble-debug.log

      - name: Write CI diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "StageGrid Android CI"
            echo "ref: $GITHUB_REF"
            echo "sha: $GITHUB_SHA"
            echo "unit_tests: ${{ steps.unit_tests.outcome }}"
            echo "assemble_debug: ${{ steps.assemble_debug.outcome }}"
            echo
            if [ -f ci-unit-tests.log ]; then
              echo "===== UNIT TESTS (tail) ====="
              tail -n 300 ci-unit-tests.log
              echo
            fi
            if [ -f ci-assemble-debug.log ]; then
              echo "===== ASSEMBLE DEBUG (tail) ====="
              tail -n 500 ci-assemble-debug.log
              echo
            fi
            if [ -f ci-sdk-install.log ]; then
              echo "===== SDK INSTALL (tail) ====="
              tail -n 100 ci-sdk-install.log
            fi
          } > ci-diagnostics.txt

      - name: Upload APK
        if: steps.assemble_debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: stagegrid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stagegrid-ci-diagnostics
          path: ci-diagnostics.txt

      - name: Fail job when validation failed
        if: steps.unit_tests.outcome == 'failure' || steps.assemble_debug.outcome == 'failure'
        shell: bash
        run: exit 1
