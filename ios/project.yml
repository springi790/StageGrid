name: StageGridIOS
options:
  bundleIdPrefix: dev.stagegrid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.0-alpha01"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: es
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  StageGridIOS:
    type: application
    platform: iOS
    sources:
      - path: StageGridIOS
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stagegrid.ios
        PRODUCT_NAME: StageGrid
        INFOPLIST_FILE: StageGridIOS/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
