name: StageGridIOS
options:
  bundleIdPrefix: dev.stagegrid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.7.0-alpha02"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_LANGUAGE: es
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  StageGridIOS:
    type: application
    platform: iOS
    sources:
      - path: StageGridIOS
        excludes:
          - Info.plist
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.stagegrid.ios
        PRODUCT_NAME: StageGrid
        INFOPLIST_FILE: StageGridIOS/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
